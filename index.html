<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 1 (Ms Thao)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #FDF9F1; color: #1E293B; font-family: 'Quicksand', system-ui, sans-serif; font-weight: 600; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding: 56px 16px 70px; }
header { text-align: center; }
header h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 700; color: #1E293B; letter-spacing: .2px; }
header p { margin: 14px 0 0; font-size: clamp(.95rem, 2.4vw, 1.15rem); color: #475569; font-weight: 500; }
.divider { width: 50%; height: 5px; border-radius: 99px; background: #CBD5E1; margin: 34px auto 40px; }
.card { background: #fff; border: 1px solid #D5EBDD; border-radius: 22px; overflow: hidden; margin-bottom: 28px; box-shadow: 0 2px 10px rgba(30, 41, 59, .04); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #F3FCF7; border-bottom: 1px solid #D5EBDD; padding: 24px 28px; }
.card-head h2 { margin: 0; font-size: 1.6rem; font-weight: 700; color: #1F4D38; }
.pill { background: #BDF0D3; color: #1F6B46; font-size: .95rem; font-weight: 700; padding: 8px 20px; border-radius: 999px; white-space: nowrap; }
.rows { padding: 14px 24px 18px; }
.row { display: flex; align-items: center; gap: 22px; padding: 22px 18px; border-bottom: 1px solid #EEF2F6; border-radius: 16px; transition: background .15s; }
.row:last-child { border-bottom: 0; }
.row:hover { background: #F8FAFC; }
.num { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-weight: 700; font-size: 1.6rem; color: #2F7A57; min-width: 2.2ch; }
.name { flex: 1; font-size: 1.3rem; font-weight: 700; color: #1E293B; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.new { background: #FEF3C7; color: #B45309; font-size: .7rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.open { color: #334155; font-size: 1.15rem; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.open:hover { color: #1F6B46; }
.msg { text-align: center; color: #64748B; padding: 40px 10px; }
footer { text-align: center; color: #94A3B8; font-size: .8rem; margin-top: 10px; }
a:focus-visible { outline: 3px solid #2F7A57; outline-offset: 3px; border-radius: 6px; }
@media (max-width: 560px) {
  .card-head { padding: 18px; }
  .card-head h2 { font-size: 1.25rem; }
  .rows { padding: 8px 8px 12px; }
  .row { gap: 12px; padding: 16px 10px; }
  .num { font-size: 1.25rem; }
  .name { font-size: 1.05rem; }
  .open { font-size: .95rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>English 1 (Ms Thao)</h1>
    <p>Collection of practice materials and interactive exercises.</p>
    <div class="divider"></div>
  </header>
  <main id="list"><p class="msg">Loading lessons...</p></main>
  <footer id="foot"></footer>
</div>
<noscript><p class="msg">Please turn on JavaScript to see the lesson list.</p></noscript>

<script>
/* ============ SETTINGS (edit only if needed) ============ */
const CONFIG = {
  owner: "thaodtp0",    // GitHub username
  repo: "E1",           // repository name
  branch: "",           // leave empty to use the default branch
  folder: "",           // "" = whole repository. Example: "lessons" to list only that folder
  exclude: ["index.html", "404.html"],
  newDays: 14,          // show a NEW tag for lessons updated within this many days
  cacheMinutes: 5       // cache time for the GitHub list
};
/* ========================================================= */

function detectRepo() {
  let owner = CONFIG.owner, repo = CONFIG.repo;
  const host = location.hostname;
  if (host.endsWith('.github.io')) {
    if (!owner) owner = host.split('.')[0];
    if (!repo) {
      const first = location.pathname.split('/').filter(Boolean)[0];
      repo = (first && !first.includes('.')) ? first : host;
    }
  }
  return { owner, repo };
}

function prettyName(path) {
  const base = path.split('/').pop().replace(/\.html?$/i, '').replace(/[_-]+/g, ' ');
  return base.charAt(0).toUpperCase() + base.slice(1);
}
function inFolder(path) {
  const f = CONFIG.folder.replace(/^\/+|\/+$/g, '');
  return !f || path.startsWith(f + '/');
}
function isCandidate(path) {
  if (!/\.html?$/i.test(path)) return false;
  const parts = path.split('/');
  if (parts.some(p => p.startsWith('.') || p === 'node_modules')) return false;
  if (CONFIG.exclude.includes(parts[parts.length - 1])) return false;
  return inFolder(path);
}

async function loadManifest() {
  try {
    const res = await fetch('lessons.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || !Array.isArray(data.lessons)) return null;
    return {
      generated: data.generated || '',
      items: data.lessons.filter(l => isCandidate(l.path)).map(l => ({ path: l.path, title: l.title || prettyName(l.path), updated: l.updated || '' }))
    };
  } catch (e) { return null; }
}

async function fetchTitle(path) {
  try {
    const res = await fetch(encodeURI(path));
    if (!res.ok) return prettyName(path);
    const text = await res.text();
    const m = text.match(/<title>([\s\S]*?)<\/title>/i);
    if (!m) return prettyName(path);
    const doc = new DOMParser().parseFromString(m[1], 'text/html');
    return (doc.documentElement.textContent || '').trim() || prettyName(path);
  } catch (e) { return prettyName(path); }
}

async function loadFromApi() {
  const { owner, repo } = detectRepo();
  if (!owner || !repo) throw new Error('Cannot detect the repository. Set owner and repo in CONFIG.');
  const key = 'lessonIndex:' + owner + '/' + repo + '/' + CONFIG.folder;
  try {
    const c = JSON.parse(localStorage.getItem(key) || 'null');
    if (c && Date.now() - c.time < CONFIG.cacheMinutes * 60000) return { generated: '', items: c.items };
  } catch (e) {}
  const ref = CONFIG.branch || 'HEAD';
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${ref}?recursive=1`);
  if (!res.ok) throw new Error('GitHub answered ' + res.status + '. If you see 403, wait a few minutes (rate limit) or use the lessons.json workflow.');
  const data = await res.json();
  const paths = (data.tree || []).filter(n => n.type === 'blob' && isCandidate(n.path)).map(n => n.path);
  const items = await Promise.all(paths.map(async p => ({ path: p, title: await fetchTitle(p), updated: '' })));
  try { localStorage.setItem(key, JSON.stringify({ time: Date.now(), items })); } catch (e) {}
  return { generated: '', items };
}

function lessonNumber(item) {
  const m = (item.title + ' ' + item.path).match(/lesson\s*[_-]?\s*(\d+)/i);
  return m ? parseInt(m[1], 10) : null;
}
function sortAsc(a, b) {
  const na = lessonNumber(a), nb = lessonNumber(b);
  if (na !== null && nb !== null && na !== nb) return na - nb;
  if (na !== null && nb === null) return -1;
  if (na === null && nb !== null) return 1;
  const t = a.title.localeCompare(b.title, undefined, { numeric: true });
  return t || a.path.localeCompare(b.path);
}
function isNew(iso) {
  const d = new Date(iso);
  return !isNaN(d) && (Date.now() - d.getTime()) < CONFIG.newDays * 86400000;
}
function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render(items, generated) {
  const list = document.getElementById('list');
  if (!items.length) { list.innerHTML = '<p class="msg">No lessons yet. New lessons will appear here after you upload them.</p>'; return; }
  const rows = items.sort(sortAsc).map((i, k) => `
    <div class="row">
      <span class="num">${String(k + 1).padStart(2, '0')}</span>
      <span class="name">${esc(i.title)}${i.updated && isNew(i.updated) ? '<span class="new">NEW</span>' : ''}</span>
      <a class="open" href="${encodeURI(i.path)}">Open Exercise</a>
    </div>`).join('');
  list.innerHTML = `<section class="card"><div class="card-head"><h2>📚 Course Lessons</h2><span class="pill">Active</span></div><div class="rows">${rows}</div></section>`;
  document.getElementById('foot').textContent = generated ? 'List updated ' + fmtDate(generated) : '';
}

(async function init() {
  const list = document.getElementById('list');
  try {
    let result = await loadManifest();
    if (!result) result = await loadFromApi();
    render(result.items, result.generated);
  } catch (e) {
    list.innerHTML = '<p class="msg">Could not load the lesson list.<br>' + esc(e.message) + '</p>';
  }
})();
</script>
</body>
</html>
