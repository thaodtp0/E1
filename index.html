<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English 1 (Ms Thao)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #FBF9F1; color: #2D3748; }
        h1 { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="min-h-screen py-12 px-4">
    <!-- PAGE HEADER -->
    <div class="max-w-3xl mx-auto text-center space-y-3 mb-10">
        <h1 class="text-4xl md:text-5xl font-bold text-slate-800 tracking-wide">English 1 (Ms Thao)</h1>
        <p class="text-slate-600 font-medium text-sm md:text-base">
            Collection of practice materials and interactive exercises.
        </p>
        <div class="w-1/2 mx-auto border-b-2 border-slate-300 pt-2"></div>
    </div>

    <!-- LESSON LIST CONTAINER -->
    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-5 bg-emerald-50/70 font-bold text-xl text-emerald-900 border-b border-emerald-100 flex items-center justify-between">
                <span>📚 Course Lessons</span>
                <span class="text-xs bg-emerald-200 text-emerald-800 px-3 py-1 rounded-full">Active</span>
            </div>
            
            <div id="lessons-container" class="p-4 space-y-2">
                <div class="p-6 text-center text-slate-400 text-sm animate-pulse">Loading lessons...</div>
            </div>
        </div>
    </div>

    <script>
        const username = window.location.hostname.split('.')[0] || 'thaodtp0';
        const repo = 'E1';

        async function fetchLessons() {
            const container = document.getElementById('lessons-container');
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                if (!response.ok) throw new Error('Repo not found');
                const data = await response.json();
                
                // Lọc lấy các folder dạng lesson1, lesson2, lesson10...
                const lessonFolders = data
                    .filter(item => item.type === 'dir' && /^lesson\d+$/i.test(item.name))
                    .sort((a, b) => parseInt(a.name.replace(/\D/g, ''), 10) - parseInt(b.name.replace(/\D/g, ''), 10));

                if (lessonFolders.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm italic">No lessons uploaded yet.</div>`;
                    return;
                }

                container.innerHTML = '';
                lessonFolders.forEach((folder, index) => {
                    const match = folder.name.match(/\d+/);
                    const lessonNum = match ? match[0] : (index + 1);
                    const formattedNum = lessonNum.toString().padStart(2, '0');
                    const borderClass = index < lessonFolders.length - 1 ? 'border-b border-slate-100' : '';

                    container.insertAdjacentHTML('beforeend', `
                        <div class="flex items-center justify-between p-4 hover:bg-slate-50 rounded-lg transition ${borderClass}">
                            <div class="flex items-center space-x-4">
                                <span class="text-lg font-bold text-emerald-700 font-mono">${formattedNum}</span>
                                <span class="font-bold text-slate-800">Lesson ${lessonNum}</span>
                            </div>
                            <a href="./${folder.name}/index.html" class="text-sm font-bold text-slate-700 underline hover:text-emerald-600 transition">Open Exercise</a>
                        </div>
                    `);
                });
            } catch (error) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm italic">No lessons available yet.</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchLessons);
    </script>
</body>
</html>
